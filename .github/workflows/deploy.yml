name: Deploy to ServerByte Production (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SERVERBYTE_SSH_HOST || secrets.SSH_HOST || 'ssh.us.stackcp.com' }}
      SSH_USER: ${{ secrets.SERVERBYTE_SSH_USER || secrets.SSH_USER || 'pettahmall.com' }}
      SSH_PORT: ${{ secrets.SERVERBYTE_SSH_PORT || secrets.SSH_PORT || '22' }}
      SSH_KEY: ${{ secrets.SERVERBYTE_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      TARGET_PATH: ${{ secrets.SERVERBYTE_SSH_PATH || secrets.FRONTEND_SSH_PATH || 'glomaint.com/web' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Phase 1: Setup Node.js & Build Static Frontend
      # ----------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite Production Bundle
        run: npm run build

      # ----------------------------------------------------
      # Phase 2: Setup SSH Credentials
      # ----------------------------------------------------
      - name: Add SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ----------------------------------------------------
      # Phase 3: Create Pre-Deployment Snapshot Backup
      # ----------------------------------------------------
      - name: Snapshot current working version on ServerByte
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/.deploy_backups/last_known_good/web; if [ -d ~/${TARGET_PATH} ]; then rsync -az ~/${TARGET_PATH}/ ~/.deploy_backups/last_known_good/web/ 2>/dev/null || true; fi; echo 'Snapshot completed'"

      # ----------------------------------------------------
      # Phase 4: Deploy Build Output to ServerByte
      # (Preserves server-side .env file so credentials stay safely on the host)
      # ----------------------------------------------------
      - name: Sync dist/ to ServerByte docroot
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/${TARGET_PATH}"

          rsync -az --delete \
            --exclude='.env' \
            -e "ssh -4 -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
            dist/ "${SSH_USER}@${SSH_HOST}:~/${TARGET_PATH}/"

      # ----------------------------------------------------
      # Phase 5: Verify Deployment Health
      # ----------------------------------------------------
      - name: Deployment Verification
        run: |
          echo "Verifying deployment at ServerByte..."
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" "if [ -f ~/${TARGET_PATH}/index.html ]; then echo '✅ index.html is in place.'; else echo '❌ index.html missing!'; exit 1; fi"

      # ----------------------------------------------------
      # Phase 7: Secure Cleanup
      # ----------------------------------------------------
      - name: Clean up SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
