<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Feedback — Gloma International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1748;
    --navy-deep:#050c2b;
    --navy-soft:#10225e;
    --blue-a:#1747c9;
    --blue-b:#1e8fff;
    --yellow:#ffc629;
    --yellow-deep:#e6ab00;
    --white:#ffffff;
    --muted:rgba(255,255,255,0.72);
    --card-w:360px;
    --gap:26px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins','Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 18% 20%, rgba(30,143,255,0.20), transparent 60%),
      radial-gradient(ellipse 900px 600px at 85% 80%, rgba(255,198,41,0.10), transparent 55%),
      linear-gradient(180deg, var(--navy-deep), var(--navy) 55%, var(--navy-deep));
    background-size:180% 180%, 180% 180%, 100% 100%;
    animation:tm-bg-pan 16s ease-in-out infinite;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:70px 0;
    overflow-x:hidden;
  }

  @keyframes tm-bg-pan{
    0%{ background-position:10% 10%, 90% 90%, 0 0; }
    50%{ background-position:22% 22%, 78% 78%, 0 0; }
    100%{ background-position:10% 10%, 90% 90%, 0 0; }
  }

  /* ===== Marquee viewport ===== */
  .tm-viewport{
    position:relative;
    width:100%;
    max-width:100vw;
    overflow:hidden;
    padding:24px 0 40px;
  }

  .tm-viewport{
    cursor:grab;
    touch-action:pan-y;
  }
  .tm-viewport.dragging{
    cursor:grabbing;
  }

  .tm-track{
    display:flex;
    gap:var(--gap);
    width:max-content;
    will-change:transform;
    user-select:none;
    -webkit-user-select:none;
  }
  .tm-track img, .tm-card{
    -webkit-user-drag:none;
  }

  /* Edge blur/fade overlays */
  .tm-edge{
    position:absolute;
    top:0;
    bottom:0;
    width:min(22vw,260px);
    z-index:5;
    pointer-events:none;
    -webkit-backdrop-filter:blur(7px);
    backdrop-filter:blur(7px);
  }
  .tm-edge.left{
    left:0;
    background:linear-gradient(to right, var(--navy-deep) 0%, rgba(5,12,43,0.55) 40%, transparent 100%);
    -webkit-mask-image:linear-gradient(to right, black 0%, black 35%, transparent 100%);
    mask-image:linear-gradient(to right, black 0%, black 35%, transparent 100%);
  }
  .tm-edge.right{
    right:0;
    background:linear-gradient(to left, var(--navy-deep) 0%, rgba(5,12,43,0.55) 40%, transparent 100%);
    -webkit-mask-image:linear-gradient(to left, black 0%, black 35%, transparent 100%);
    mask-image:linear-gradient(to left, black 0%, black 35%, transparent 100%);
  }

  /* ===== Card ===== */
  .tm-card{
    position:relative;
    flex:0 0 auto;
    width:var(--card-w);
    background:linear-gradient(150deg, var(--blue-a), var(--blue-b) 80%);
    border-radius:22px;
    padding:30px 28px 24px;
    color:var(--white);
    box-shadow:0 18px 40px -14px rgba(5,12,43,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.14);
    transform:scale(0.94);
    opacity:0.6;
    filter:saturate(0.85);
    transition:transform .5s cubic-bezier(.22,.61,.36,1), opacity .5s ease, filter .5s ease, box-shadow .5s ease;
    animation:tm-fade-up .7s cubic-bezier(.22,.61,.36,1) both;
  }
  .tm-card.is-focus{
    transform:scale(1.05);
    opacity:1;
    filter:saturate(1.05);
    box-shadow:0 26px 60px -16px rgba(23,71,201,0.55), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .tm-card:nth-child(1){animation-delay:.04s}
  .tm-card:nth-child(2){animation-delay:.10s}
  .tm-card:nth-child(3){animation-delay:.16s}
  .tm-card:nth-child(4){animation-delay:.22s}
  .tm-card:nth-child(5){animation-delay:.28s}
  .tm-card:nth-child(6){animation-delay:.34s}
  .tm-card:nth-child(7){animation-delay:.40s}
  .tm-card:nth-child(8){animation-delay:.46s}

  @keyframes tm-fade-up{
    from{ opacity:0; transform:translateY(26px) scale(0.9); }
    to{ opacity:0.6; transform:translateY(0) scale(0.94); }
  }

  .tm-quote-icon{
    width:38px;
    height:38px;
    opacity:0.9;
    margin-bottom:14px;
    animation:tm-float 4.5s ease-in-out infinite;
  }
  .tm-quote-icon svg{width:100%;height:100%;display:block;fill:rgba(255,255,255,0.85);}

  @keyframes tm-float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }

  .tm-badge{
    position:absolute;
    top:-14px;
    right:22px;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    color:var(--navy);
    font-size:13px;
    font-weight:700;
    padding:7px 13px 7px 10px;
    border-radius:999px;
    box-shadow:0 8px 18px -6px rgba(5,12,43,0.4);
    animation:tm-badge-pulse 2.6s ease-in-out infinite;
  }
  .tm-badge svg{width:14px;height:14px;fill:#ff4d6d;}

  @keyframes tm-badge-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }

  .tm-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .tm-avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--yellow), var(--yellow-deep));
    color:var(--navy-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:15px;
    flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(255,255,255,0.18);
  }
  .tm-meta .tm-name{
    font-weight:700;
    font-size:15px;
    line-height:1.3;
  }
  .tm-stars{
    color:var(--yellow);
    font-size:13px;
    letter-spacing:2px;
    margin-top:2px;
  }

  .tm-text{
    font-size:14.5px;
    line-height:1.65;
    color:rgba(255,255,255,0.92);
    margin-bottom:22px;
    min-height:118px;
  }

  .tm-footer{
    display:flex;
    align-items:center;
    gap:18px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.16);
  }
  .tm-icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:rgba(255,255,255,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    transition:color .2s ease, transform .2s ease;
  }
  .tm-icon-btn svg{width:19px;height:19px;}
  .tm-icon-btn:hover{color:var(--yellow);transform:translateY(-2px);}
  .tm-icon-btn.liked{color:#ff4d6d;}
  .tm-icon-btn.liked svg{fill:#ff4d6d;}
  .tm-icon-btn.pop svg{animation:tm-heart-pop .45s ease;}

  @keyframes tm-heart-pop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.5); }
    60%{ transform:scale(0.85); }
    100%{ transform:scale(1); }
  }

  @media (max-width:640px){
    :root{ --card-w:300px; --gap:18px; }
    .tm-text{min-height:150px;}
  }
</style>
</head>
<body>

<div class="tm-viewport">
  <div class="tm-edge left" aria-hidden="true"></div>
  <div class="tm-edge right" aria-hidden="true"></div>
  <div class="tm-track" id="tmTrack">
    <!-- cards injected by JS (original set + duplicate set for seamless loop) -->
  </div>
</div>

<script>
(function(){
  var reviews = [
    {
      name:"Hyman Brady", role:"Store Owner",
      text:"10 out of 10! I recently ordered a print but inputted my delivery address incorrectly. Contacted the team and they quickly arranged a reprint. The communication was excellent — quick replies, polite and very kind. Will be ordering again soon!",
      likes:125, stars:5
    },
    {
      name:"Amina Yusuf", role:"Founder, Velosea",
      text:"Gloma International transformed our online presence. Their creativity and professionalism are unmatched from the very first call.",
      likes:98, stars:5
    },
    {
      name:"David Okoro", role:"CEO, Groceria",
      text:"The team delivered a stunning app experience. Communication was smooth from start to finish and every deadline was met.",
      likes:76, stars:5
    },
    {
      name:"Sara Bello", role:"Marketing Lead, Zenara",
      text:"Highly recommended. They understand branding and how it genuinely connects with an audience — not just how it looks.",
      likes:64, stars:5
    },
    {
      name:"Michael Chen", role:"Founder, Fitverse",
      text:"Our social channels finally feel consistent and on-brand. Engagement has nearly doubled since we started working together.",
      likes:112, stars:5
    },
    {
      name:"Lara Mensah", role:"Ops Manager, Summit Logistics",
      text:"Their IT support has been rock solid. Fast response times and they actually explain things clearly instead of using jargon.",
      likes:57, stars:5
    },
    {
      name:"Ryan Castillo", role:"Co-Founder, Revise",
      text:"From packaging to launch campaign, Gloma nailed the whole brand rollout. Couldn't be happier with the final result.",
      likes:83, stars:5
    },
    {
      name:"Priya Nandan", role:"Founder, Loomwork",
      text:"Responsive, detail-oriented and genuinely invested in our growth. It feels like having an in-house team, not an agency.",
      likes:70, stars:5
    }
  ];

  function initials(name){
    return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
  }

  var starsIcon = '★★★★★';
  var quoteSvg = '<svg viewBox="0 0 32 24"><path d="M0 24V14.4C0 6.4 5.2 0.8 13.2 0L14.8 3.6C10.4 4.8 8 7.6 8 11.2H14V24H0ZM18 24V14.4C18 6.4 23.2 0.8 31.2 0L32.8 3.6C28.4 4.8 26 7.6 26 11.2H32V24H18Z"/></svg>';
  var heartSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
  var commentSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5H3l3.2-3.2A8.38 8.38 0 1 1 21 11.5z"/></svg>';
  var shareSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  var badgeHeartSvg = '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';

  function cardHTML(r){
    return (
      '<div class="tm-card">' +
        '<div class="tm-badge">' + badgeHeartSvg + '<span>' + r.likes + '</span></div>' +
        '<div class="tm-quote-icon">' + quoteSvg + '</div>' +
        '<div class="tm-header">' +
          '<div class="tm-avatar">' + initials(r.name) + '</div>' +
          '<div class="tm-meta">' +
            '<div class="tm-name">' + r.name + '</div>' +
            '<div class="tm-stars">' + starsIcon.slice(0, r.stars) + '</div>' +
          '</div>' +
        '</div>' +
        '<p class="tm-text">' + r.text + '</p>' +
        '<div class="tm-footer">' +
          '<button class="tm-icon-btn like" aria-label="Like" aria-pressed="false">' + heartSvg + '</button>' +
          '<button class="tm-icon-btn" aria-label="Comment">' + commentSvg + '</button>' +
          '<button class="tm-icon-btn" aria-label="Share">' + shareSvg + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  var viewport = document.querySelector('.tm-viewport');
  var track = document.getElementById('tmTrack');
  var html = reviews.map(cardHTML).join('');
  track.innerHTML = html + html; // duplicate for seamless infinite loop

  var cards = Array.prototype.slice.call(track.querySelectorAll('.tm-card'));

  // Highlight whichever card currently sits in the middle of the screen.
  function updateFocus(){
    var centerX = window.innerWidth / 2;
    cards.forEach(function(card){
      var rect = card.getBoundingClientRect();
      var cardCenter = rect.left + rect.width / 2;
      var dist = Math.abs(cardCenter - centerX);
      if (dist < rect.width * 0.55) {
        card.classList.add('is-focus');
      } else {
        card.classList.remove('is-focus');
      }
    });
  }

  /* ===== Drag-to-scroll + auto marquee =====
     - Auto-scrolls right to left at a steady speed.
     - Mouse hover or a touch/mouse press stops the auto-scroll immediately.
     - Dragging (mouse or touch) moves the track left/right by hand.
     - Releasing lets any drag momentum glide to a stop, then auto-scroll resumes. */
  var pos = 0;              // current track translateX in px (always <= 0)
  var singleSetWidth = 0;   // width of one full (non-duplicated) set of cards
  var speed = 0.045;        // auto-scroll px/ms
  var velocity = 0;         // drag momentum, px/ms
  var isDragging = false;
  var isHover = false;
  var dragStartX = 0;
  var dragStartPos = 0;
  var lastMoveX = 0;
  var lastMoveTime = 0;
  var lastTs = null;

  function measure(){
    var gap = parseFloat(getComputedStyle(track).gap) || 0;
    singleSetWidth = track.scrollWidth / 2 + gap / 2;
  }

  function wrap(p){
    if (singleSetWidth <= 0) return p;
    while (p <= -singleSetWidth) p += singleSetWidth;
    while (p > 0) p -= singleSetWidth;
    return p;
  }

  function applyTransform(){
    track.style.transform = 'translateX(' + pos + 'px)';
  }

  function frame(ts){
    if (lastTs == null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 48);
    lastTs = ts;

    if (!isDragging) {
      if (Math.abs(velocity) > 0.01) {
        pos += velocity * dt;
        velocity *= 0.945; // momentum friction
      } else if (!isHover) {
        pos -= speed * dt; // steady auto-scroll, right to left
      }
      pos = wrap(pos);
      applyTransform();
    }
    updateFocus();
    requestAnimationFrame(frame);
  }

  measure();
  window.addEventListener('resize', measure);
  requestAnimationFrame(frame);

  function onPointerDown(e){
    isDragging = true;
    velocity = 0;
    viewport.classList.add('dragging');
    dragStartX = e.clientX;
    dragStartPos = pos;
    lastMoveX = e.clientX;
    lastMoveTime = performance.now();
    try { viewport.setPointerCapture(e.pointerId); } catch(err){}
  }
  function onPointerMove(e){
    if (!isDragging) return;
    var x = e.clientX;
    pos = wrap(dragStartPos + (x - dragStartX));
    applyTransform();
    var now = performance.now();
    var dt = now - lastMoveTime;
    if (dt > 8) {
      velocity = (x - lastMoveX) / dt; // carries drag speed into release momentum
      lastMoveX = x;
      lastMoveTime = now;
    }
  }
  function onPointerUp(){
    if (!isDragging) return;
    isDragging = false;
    viewport.classList.remove('dragging');
  }

  viewport.addEventListener('pointerdown', onPointerDown);
  viewport.addEventListener('pointermove', onPointerMove);
  viewport.addEventListener('pointerup', onPointerUp);
  viewport.addEventListener('pointercancel', onPointerUp);
  viewport.addEventListener('mouseenter', function(){ isHover = true; });
  viewport.addEventListener('mouseleave', function(){ isHover = false; });

  // Like button: pop animation + live count, delegated so it works on both duplicated sets.
  track.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.tm-icon-btn.like') : null;
    if (!btn) return;
    var card = btn.closest('.tm-card');
    var countEl = card.querySelector('.tm-badge span');
    var liked = btn.classList.toggle('liked');
    btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
    if (countEl) {
      countEl.textContent = parseInt(countEl.textContent, 10) + (liked ? 1 : -1);
    }
    btn.classList.remove('pop');
    void btn.offsetWidth; // restart the pop animation
    btn.classList.add('pop');
  });
})();
</script>

</body>
</html>
